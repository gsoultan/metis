# What a tag publishes, besides the image.
#
# The container is the supported way to run Metis and `.github/workflows/release.yml`
# publishes it. This adds the other thing people ask for: a binary they can drop
# on a host, run under systemd, or copy into an image of their own. The two are
# built from the same commit with the same flags, so "which version is running"
# has one answer whichever artifact you took.
#
# **Linux only, deliberately.** Metis is a server. It is developed on macOS and
# it will compile there, but nothing tests it on macOS or Windows and no
# deployment target runs it there — publishing a binary implies supporting it.
# Both Linux architectures ship, because Graviton and Ampere are ordinary
# Kubernetes nodes now and the cross-compile is free.
version: 2

project_name: metis

before:
  hooks:
    # ui/embed.go carries `//go:embed all:dist`, and ui/dist is gitignored — so
    # on a clean checkout there is no directory to embed and *any* Go build of
    # this module fails before it starts. The UI is built here rather than in
    # the workflow so that a local `goreleaser release --snapshot` produces the
    # same artifact CI does, rather than silently embedding whatever dist was
    # last left lying around.
    - sh -c "cd ui && bun install --frozen-lockfile"
    - sh -c "cd ui && bun run build"

builds:
  - id: metis
    main: ./cmd/metis
    binary: metis
    env:
      # Every driver in use is pure Go, and a static binary is what makes the
      # archive runnable on a host whose libc is older than the builder's.
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      # THE VERSION STAMP. Repeated verbatim in the archive name below, because
      # a global `env:` entry is resolved before `.Version` and `.IsSnapshot`
      # exist and silently evaluates to the empty string, and `variables:` is
      # GoReleaser Pro. Change one, change the other.
      #
      # `.Tag` and not `.Version` for a release: GoReleaser's `.Version` strips
      # the leading `v`, while the image is stamped from GITHUB_REF_NAME, which
      # keeps it. `.Version` here would have the tarball report `1.4.2` and the
      # container report `v1.4.2` for the same commit — two answers to the first
      # question of any incident.
      #
      # And not `.Tag` for a snapshot, which is where this first went wrong:
      # outside a release `.Tag` is the *last* tag, so `goreleaser release
      # --snapshot` produced a binary stamped `v0.3.0` — a laptop build claiming
      # to be a shipped release, on the probe whose entire purpose is answering
      # which version is running. A snapshot stamps itself
      # `0.3.1-snapshot-<sha>`, deliberately without the `v`, so nothing
      # downstream can mistake it for a tag.
      - -s -w -X github.com/gsoultan/metis/internal/app.version={{ if .IsSnapshot }}{{ .Version }}{{ else }}{{ .Tag }}{{ end }}
    # Reproducible: without this the binary carries the moment the runner
    # happened to build it, so re-running a release produces different bytes for
    # the same source and the checksums stop meaning anything.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: metis
    formats:
      - tar.gz
    # The same stamp the binary carries — see the ldflags comment above.
    name_template: "metis_{{ if .IsSnapshot }}{{ .Version }}{{ else }}{{ .Tag }}{{ end }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      # The operational documents, in the tarball rather than a link: the person
      # unpacking this on a host at two in the morning is the person who needs
      # the runbook, and they may not have the repository.
      - src: docs/**/*
        dst: docs

# Linux packages for the same binary: deb (Debian, Ubuntu), rpm (RHEL, Fedora,
# SUSE), apk (Alpine) and Arch. Each installs the binary at /usr/bin/metis, a
# `metis` system user, /etc/metis/metis.env for the settings, and /var/lib/metis
# as the working directory, where the setup wizard writes config.yaml. The
# service is installed but never enabled or started by the package: Metis
# refuses to start without a database and its secrets, and an upgrade runs
# migrations, which the operator starts on purpose. See deploy/linux/.
nfpms:
  - id: metis
    package_name: metis
    ids:
      - metis
    formats:
      - deb
      - rpm
      - apk
      - archlinux
    # `.ConventionalFileName` names each package the way its own tools expect
    # (metis_0.7.0_amd64.deb, metis-0.7.0-1.x86_64.rpm, ...). The version inside
    # a package has no leading `v`, which is what every package manager compares
    # on; the binary inside still reports the tag, as the archive's does.
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Gembit Soultan Shirazi
    maintainer: Gembit Soultan Shirazi <gembit.soultan@gmail.com>
    homepage: https://github.com/gsoultan/metis
    description: |-
      BPMN 2.0 process orchestrator and DMN decision engine.
      A single static binary with the web UI embedded, run as a service against
      PostgreSQL.
    license: MIT
    section: net
    priority: optional
    bindir: /usr/bin
    # Reproducible, as the binary is: the same tag builds the same package bytes.
    mtime: "{{ .CommitDate }}"
    contents:
      - src: deploy/linux/metis.service
        dst: /usr/lib/systemd/system/metis.service
        packager: deb
      - src: deploy/linux/metis.service
        dst: /usr/lib/systemd/system/metis.service
        packager: rpm
      - src: deploy/linux/metis.service
        dst: /usr/lib/systemd/system/metis.service
        packager: archlinux
      # Alpine runs OpenRC, not systemd.
      - src: deploy/linux/metis.openrc
        dst: /etc/init.d/metis
        packager: apk
        file_info:
          mode: 0755
      # Secrets live here, so the service user may read it and nobody else
      # may. `config|noreplace` keeps an operator's edits through an upgrade.
      - src: deploy/linux/metis.env
        dst: /etc/metis/metis.env
        type: config|noreplace
        file_info:
          mode: 0640
          owner: root
          group: metis
      - dst: /etc/metis
        type: dir
        file_info:
          mode: 0750
          owner: root
          group: metis
      # config.yaml is written here and carries the encryption key, so it is
      # the service user's alone.
      - dst: /var/lib/metis
        type: dir
        file_info:
          mode: 0750
          owner: metis
          group: metis
      - src: LICENSE
        dst: /usr/share/licenses/metis/LICENSE
        file_info:
          mode: 0644
      - src: README.md
        dst: /usr/share/doc/metis/README.md
        file_info:
          mode: 0644
      - src: CHANGELOG.md
        dst: /usr/share/doc/metis/CHANGELOG.md
        file_info:
          mode: 0644
      # The runbooks travel with the binary, as they do in the archive.
      - src: docs/
        dst: /usr/share/doc/metis/docs
        type: tree
    scripts:
      preinstall: deploy/linux/scripts/preinstall.sh
      postinstall: deploy/linux/scripts/postinstall.sh
      preremove: deploy/linux/scripts/preremove.sh
      postremove: deploy/linux/scripts/postremove.sh
    deb:
      lintian_overrides:
        - statically-linked-binary
        - embedded-library
    rpm:
      group: Applications/System
      summary: BPMN 2.0 process orchestrator and DMN decision engine
      compression: zstd
    archlinux:
      packager: Gembit Soultan Shirazi <gembit.soultan@gmail.com>
      pkgbase: metis

checksum:
  name_template: checksums.txt
  algorithm: sha256

# One bill of materials per archive, generated from the built artifact rather
# than from go.mod, so it lists what is actually in the binary. The image
# publishes the same thing; a binary released without it would be the weaker
# half of the same release.
sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^chore\\(ci\\):"
      - "^chore\\(deps\\):"
      - "^docs:"
      - "^test:"

release:
  draft: false
  # A pre-release tag stays marked as one, matching the image job's rule that
  # `latest` only moves for a final release. Somebody running a release
  # candidate in production should have chosen to.
  prerelease: auto
  footer: |
    ## Running it

    The container is the supported artifact:

    ```
    docker pull ghcr.io/gsoultan/metis:{{ .Tag }}
    ```

    The archives above are the same build for anyone deploying a binary
    directly, and the `.deb`, `.rpm`, `.apk` and Arch packages install that
    binary as a service: a `metis` user, settings in `/etc/metis/metis.env`,
    state in `/var/lib/metis`. The package does not start it; fill in the
    settings, then `systemctl enable --now metis`. Verify any of them against
    `checksums.txt` before installing it.

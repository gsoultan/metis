# What a tag publishes, besides the image.
#
# The container is the supported way to run Metis and `.github/workflows/release.yml`
# publishes it. This adds the other thing people ask for: a binary they can drop
# on a host, run under systemd, or copy into an image of their own. The two are
# built from the same commit with the same flags, so "which version is running"
# has one answer whichever artifact you took.
#
# **Linux only, deliberately.** Metis is a server. It is developed on macOS and
# it will compile there, but nothing tests it on macOS or Windows and no
# deployment target runs it there — publishing a binary implies supporting it.
# Both Linux architectures ship, because Graviton and Ampere are ordinary
# Kubernetes nodes now and the cross-compile is free.
version: 2

project_name: metis

before:
  hooks:
    # ui/embed.go carries `//go:embed all:dist`, and ui/dist is gitignored — so
    # on a clean checkout there is no directory to embed and *any* Go build of
    # this module fails before it starts. The UI is built here rather than in
    # the workflow so that a local `goreleaser release --snapshot` produces the
    # same artifact CI does, rather than silently embedding whatever dist was
    # last left lying around.
    - sh -c "cd ui && bun install --frozen-lockfile"
    - sh -c "cd ui && bun run build"
    # release.json: what this release does to a database, read from the
    # migration list compiled into it. An installation reads it before it
    # upgrades, to say whether the database will change and whether its
    # version can be reached without a stop in between. Listed in
    # checksums.txt below, so the signature over that file covers it too.
    - go run ./cmd/releasemanifest -release {{ if .IsSnapshot }}{{ .Version }}{{ else }}{{ .Tag }}{{ end }} -out .release/release.json

builds:
  - id: metis
    main: ./cmd/metis
    binary: metis
    env:
      # Every driver in use is pure Go, and a static binary is what makes the
      # archive runnable on a host whose libc is older than the builder's.
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      # THE VERSION STAMP. Repeated verbatim in the archive name below, because
      # a global `env:` entry is resolved before `.Version` and `.IsSnapshot`
      # exist and silently evaluates to the empty string, and `variables:` is
      # GoReleaser Pro. Change one, change the other.
      #
      # `.Tag` and not `.Version` for a release: GoReleaser's `.Version` strips
      # the leading `v`, while the image is stamped from GITHUB_REF_NAME, which
      # keeps it. `.Version` here would have the tarball report `1.4.2` and the
      # container report `v1.4.2` for the same commit — two answers to the first
      # question of any incident.
      #
      # And not `.Tag` for a snapshot, which is where this first went wrong:
      # outside a release `.Tag` is the *last* tag, so `goreleaser release
      # --snapshot` produced a binary stamped `v0.3.0` — a laptop build claiming
      # to be a shipped release, on the probe whose entire purpose is answering
      # which version is running. A snapshot stamps itself
      # `0.3.1-snapshot-<sha>`, deliberately without the `v`, so nothing
      # downstream can mistake it for a tag.
      - -s -w -X github.com/gsoultan/metis/internal/app.version={{ if .IsSnapshot }}{{ .Version }}{{ else }}{{ .Tag }}{{ end }}
    # Reproducible: without this the binary carries the moment the runner
    # happened to build it, so re-running a release produces different bytes for
    # the same source and the checksums stop meaning anything.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: metis
    formats:
      - tar.gz
    # The same stamp the binary carries — see the ldflags comment above.
    name_template: "metis_{{ if .IsSnapshot }}{{ .Version }}{{ else }}{{ .Tag }}{{ end }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      # The operational documents, in the tarball rather than a link: the person
      # unpacking this on a host at two in the morning is the person who needs
      # the runbook, and they may not have the repository.
      - src: docs/**/*
        dst: docs

# Linux packages: the same binary as the archives, installed the way a host's
# package manager expects, with a service, an environment file and an account
# to run as. deb and rpm cover Debian, Ubuntu, RHEL, Fedora, Rocky and SUSE;
# apk is Alpine (OpenRC, not systemd); archlinux is Arch and its derivatives.
#
# The packages install and stop there. They do not enable, start or restart
# the service, on install or on upgrade: a fresh host has no DATABASE_URL yet,
# and docs/upgrading.md asks for a backup before a new release first starts
# against an existing database. The install message says what to do next.
#
# Removing a package stops the service but keeps /etc/metis, /var/lib/metis
# and the metis account, because /var/lib/metis/config.yaml may hold the
# at-rest encryption key.
nfpms:
  - id: metis
    package_name: metis
    ids:
      - metis
    formats:
      - deb
      - rpm
      - apk
      - archlinux
    # GoReleaser's .Version, without the leading `v`, is what every package
    # format expects; the binary inside still reports the tag (see ldflags).
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Gembit Soultan Shirazi
    maintainer: Gembit Soultan Shirazi <gembit.soultan@gmail.com>
    homepage: https://github.com/gsoultan/metis
    description: |-
      Metis BPM, a BPMN 2.0 process orchestrator and DMN decision engine.
      A static binary with the web UI embedded, run as a systemd service.
    license: MIT
    section: net
    priority: optional
    bindir: /usr/bin
    # A static binary: no shared libraries to depend on. The engine needs a
    # PostgreSQL, but not necessarily on this host, so it is not a dependency.
    contents:
      - src: deploy/linux/metis.service
        dst: /usr/lib/systemd/system/metis.service
        file_info:
          mode: 0644
        packager: deb
      - src: deploy/linux/metis.service
        dst: /usr/lib/systemd/system/metis.service
        file_info:
          mode: 0644
        packager: rpm
      - src: deploy/linux/metis.service
        dst: /usr/lib/systemd/system/metis.service
        file_info:
          mode: 0644
        packager: archlinux
      - src: deploy/linux/metis.openrc
        dst: /etc/init.d/metis
        file_info:
          mode: 0755
        packager: apk

      - dst: /etc/metis
        type: dir
        file_info:
          mode: 0750
          owner: root
          group: metis
      # Holds secrets, hence 0640 and group-readable only by the service.
      # config|noreplace: an upgrade never overwrites the operator's edits.
      - src: deploy/linux/metis.env
        dst: /etc/metis/metis.env
        type: config|noreplace
        file_info:
          mode: 0640
          owner: root
          group: metis
      - dst: /var/lib/metis
        type: dir
        file_info:
          mode: 0750
          owner: metis
          group: metis

      - src: LICENSE
        dst: /usr/share/licenses/metis/LICENSE
        file_info:
          mode: 0644
      - src: README.md
        dst: /usr/share/doc/metis/README.md
        file_info:
          mode: 0644
      - src: CHANGELOG.md
        dst: /usr/share/doc/metis/CHANGELOG.md
        file_info:
          mode: 0644
      # The runbooks, for the same reason the archive carries them.
      - src: docs/*.md
        dst: /usr/share/doc/metis/docs/
        file_info:
          mode: 0644
    scripts:
      preinstall: deploy/linux/scripts/preinstall.sh
      postinstall: deploy/linux/scripts/postinstall.sh
      preremove: deploy/linux/scripts/preremove.sh
      postremove: deploy/linux/scripts/postremove.sh
    rpm:
      group: System Environment/Daemons
      compression: zstd
    deb:
      compression: zstd
    archlinux:
      packager: Gembit Soultan Shirazi <gembit.soultan@gmail.com>

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: .release/release.json

# A signature over checksums.txt, and through it over every package, archive
# and release.json it lists. The provenance attestation below says which
# workflow built the bytes, but reading it needs the GitHub API and a token; a
# cosign bundle is one file beside the release that a host can check with
# nothing but the bundle, the file and the identity it expects. That is what an
# installation upgrading itself verifies before it runs anything it downloaded.
#
# Keyless, like the image: the certificate is issued to this workflow's OIDC
# identity and logged in the public transparency log, so there is no private
# key to keep.
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}
    output: true

# One bill of materials per archive, generated from the built artifact rather
# than from go.mod, so it lists what is actually in the binary. The image
# publishes the same thing; a binary released without it would be the weaker
# half of the same release.
sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^chore\\(ci\\):"
      - "^chore\\(deps\\):"
      - "^docs:"
      - "^test:"

release:
  draft: false
  extra_files:
    - glob: .release/release.json
  # A pre-release tag stays marked as one, matching the image job's rule that
  # `latest` only moves for a final release. Somebody running a release
  # candidate in production should have chosen to.
  prerelease: auto
  footer: |
    ## Running it

    The container is the supported artifact:

    ```
    docker pull ghcr.io/gsoultan/metis:{{ .Tag }}
    ```

    The archives above are the same build for anyone deploying a binary
    directly, and the `.deb`, `.rpm`, `.apk` and `.pkg.tar.zst` packages
    install it as a service. Verify one against `checksums.txt` before
    running it, and verify `checksums.txt` against its signature:

    ```
    cosign verify-blob checksums.txt \
      --bundle checksums.txt.sigstore.json \
      --certificate-identity https://github.com/gsoultan/metis/.github/workflows/release.yml@refs/tags/{{ .Tag }} \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    ```

    A package installs the service without starting it: set
    `DATABASE_URL` in `/etc/metis/metis.env`, then
    `systemctl enable --now metis`.

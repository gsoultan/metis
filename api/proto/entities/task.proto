syntax = "proto3";

package process;

import "google/protobuf/struct.proto";
import "entities/node.proto";
import "entities/user.proto";
import "entities/group.proto";
import "entities/project.proto";
import "entities/process_instance.proto";

option go_package = "github.com/gsoultan/metis/api/proto/entities;entities";

message Task {
  string id = 1;
  Project project = 2;
  ProcessInstance instance = 3;
  Node node = 4;
  string name = 5;
  string status = 6;
  User assignee = 7;
  repeated User candidate_users = 8;
  repeated Group candidate_groups = 9;
  int32 priority = 10;
  string due_date = 11;
  string created_at = 12;
  google.protobuf.Struct variables = 13;
  string form_key = 14;
  string form_definition = 15;

  // The BPMN node type this task came from. The UI branches on it: a manual
  // task is completed with "Mark as Done" and has no form to fill in, a user
  // task does. Without it every task looked like a user task.
  string type = 16;

  string description = 17;
}

syntax = "proto3";

package process;

import "entities/definition.proto";
import "endpoints/page.proto";

option go_package = "github.com/gsoultan/gobpm/api/proto/endpoints;endpoints";

message ListDefinitionsRequest {
  string project_id = 1;
  // Optional; see PageRequest.
  PageRequest page = 2;
}

message ListDefinitionsResponse {
  repeated ProcessDefinition definitions = 1;
  string error = 2;
  // Absent when the caller did not page, so an old client sees exactly the
  // response it saw before.
  PageInfo page = 3;
}

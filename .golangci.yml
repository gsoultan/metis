version: "2"

# ---------------------------------------------------------------------------
# Adoption note
#
# This config was introduced against an existing codebase with a large backlog,
# and CI runs it with `only-new-issues: true` so the linter blocks every *new*
# violation while the backlog is burned down by area.
#
# Do not "fix" errcheck by inserting `_ =`. A discarded error in a BPMN engine
# is a process instance that hangs forever with no incident raised. Each one
# needs a real decision — propagate, log with context, or raise an incident.
#
# Status: **the backlog is closed — this config now runs clean.** The findings
# that were doing real damage are worth naming, because they are the shapes to
# watch for:
#
#   - uuid.Parse discarded → uuid.Nil, which the repositories read as "no
#     filter". A typo'd organization id listed every project the caller could
#     see; a typo'd project id created a definition under a project nobody owns.
#   - uuid.NewV7 discarded → uuid.Nil, which is not "no id" but *the same id
#     every time*: every token colliding on one primary key.
#   - An SSE write error ignored → a goroutine spinning on a dead socket for as
#     long as events kept arriving, one leaked per client disconnect.
#   - Audit writes dropped in silence → a trail with holes that reads complete.
#   - `payload["text"].(string)` on a connector payload → a panic that took the
#     worker down on any payload spelling the field differently, and process
#     variables are untrusted input. check-type-assertions stays on for this.
#
# The wiring layer's `request.(T)` assertions are now comma-ok with a real
# error. go-kit guarantees the type in practice — a decoder, an endpoint and an
# encoder are wired as one triple — but an error at a boundary beats a panic
# inside a request handler, and it is what makes the check usable everywhere
# else, where the asserted value did come from outside.
#
# Measure the backlog with the caps off, or the numbers lie:
#
#   golangci-lint run --max-issues-per-linter=0 --max-same-issues=0
#
# The defaults collapse identical messages to three per linter, which reports a
# few dozen findings for a few hundred.
# ---------------------------------------------------------------------------

run:
  timeout: 5m

linters:
  default: standard
  enable:
    # Catches the defect class that hid the most bugs in this codebase:
    # discarded errors on the execution path. A swallowed error in a BPMN
    # engine is a silently hung process instance.
    - errcheck
    - bodyclose      # leaked HTTP response bodies in connectors
    - noctx          # HTTP requests without a context (and therefore no timeout)
    - contextcheck   # context not propagated through a call chain
    - rowserrcheck
    - sqlclosecheck
    - nilerr         # `return nil` after checking `err != nil`
    - errorlint      # %v instead of %w, type asserts instead of errors.As
    - copyloopvar
    - intrange
    - usestdlibvars
    - unconvert
    - wastedassign
    - makezero
    - durationcheck
    - gocritic
    - revive

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
    revive:
      rules:
        - name: unused-parameter
          disabled: true

  exclusions:
    generated: lax
    paths:
      - ui/node_modules
      - api/proto        # generated protobuf
    rules:
      # Tests may ignore errors on setup helpers where a failure would surface
      # as an assertion failure anyway.
      - path: (_test\.go|^tests/)
        linters:
          - errcheck
          - gocritic

      # go-kit endpoints carry the domain error in the response and reserve the
      # error return for transport failures — Failed() is what the transport
      # reads. `return Response{Err: err}, nil` is therefore correct here, and
      # nilerr cannot see the difference. This is scoped to the endpoint layer
      # only; everywhere else a nil return after a non-nil error is the bug
      # nilerr says it is.
      - path: ^server/endpoints/
        linters:
          - nilerr

      # hugeParam and rangeValCopy are performance hints, not the defect class
      # this config was adopted for. Acting on them means turning the node
      # handler interface and the adapters from values into pointers, which
      # changes copy semantics on structs the engine mutates in place — a real
      # aliasing risk for a saving nobody has measured. Left for a change that
      # can measure it; the rest of gocritic's diagnostic tag still applies.
      - linters:
          - gocritic
        text: "(hugeParam|rangeValCopy)"

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - ui/node_modules
      - api/proto

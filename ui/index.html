<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Metis BPM</title>
    <meta
      name="description"
      content="Design, run and monitor business processes. BPMN 2.0 orchestration with a DMN decision engine."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!--
      Follows the app's own light/dark setting so the browser chrome does not
      stay light while the app is dark.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1b1e" />

    <!--
      Inter is declared by the Mantine theme and index.css, and is now loaded by
      `@fontsource/inter` from src/main.tsx — bundled and served by this app.

      It used to be fetched from fonts.googleapis.com. That is wrong for this
      product in three separate ways, and the font rendering correctly on a
      developer's machine hid all of them:

        - Metis ships as a distroless image intended to run inside somebody
          else's network. An air-gapped or egress-filtered installation cannot
          reach Google, so the font silently falls back and the UI looks
          different in exactly the deployments that paid for it.
        - Embedding Google Fonts has been held to breach the GDPR (LG München I,
          3 O 17493/20), because the browser discloses the user's IP to a third
          party. This product's buyer is the EU enterprise.
        - It puts a third party on the critical path of a login screen.

      Self-hosting removes all three and the preconnect hops with them.
    -->
  </head>
  <body>
    <div id="root"></div>
    <noscript>Metis BPM requires JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

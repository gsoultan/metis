version: v2
managed:
  enabled: true
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: api/proto
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go:v1.5.1
    out: api/proto
    opt:
      - paths=source_relative
  - remote: buf.build/connectrpc/go:v1.19.1
    out: api/proto
    opt:
      - paths=source_relative
  # protoc-gen-es v2 emits schemas rather than message classes, and connect-es
  # v2 consumes them directly — so there is no separate *_connect.ts plugin any
  # more; service descriptors live alongside the messages.
  - remote: buf.build/bufbuild/es:v2.13.0
    out: ui/src/gen
    opt:
      - target=ts
inputs:
  - directory: api/proto

version: v2
managed:
  enabled: true
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: api/proto
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go:v1.5.1
    out: api/proto
    opt:
      - paths=source_relative
  - remote: buf.build/connectrpc/go:v1.19.1
    out: api/proto
    opt:
      - paths=source_relative
  # The web app's TypeScript client is generated from these same protos in
  # gsoultan/metis-server (its buf.gen.yaml), where the web app lives.
inputs:
  - directory: api/proto

# Prometheus alerting rules for Metis.
#
# The metrics have existed for a while and nothing alerted on them, which means
# every SLO in the roadmap was a number somebody could read on a dashboard if
# they happened to look. These are the ones worth waking somebody for, and each
# says what it means and what to do — an alert whose runbook is "ask whoever
# wrote it" gets silenced the first time it fires at 3am.
#
# The thresholds are the §1 targets: p95 under 150ms for reads, under 500ms for
# workflow actions, and a 0.1% error budget on 5xx.
#
#   kubectl -n metis apply -f alerts.yaml
#
# Assumes kube-prometheus-stack (PrometheusRule CRD). For a plain Prometheus,
# lift the `groups:` block into your rules file.

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: metis
  labels:
    app.kubernetes.io/name: metis
    # kube-prometheus-stack selects on this by default; check yours.
    release: kube-prometheus-stack
spec:
  groups:
    - name: metis.availability
      rules:
        - alert: MetisDown
          expr: up{job=~".*metis.*"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Metis is not being scraped
            description: >-
              No metrics for 2 minutes. One replica is the supported topology,
              so this is a full outage rather than reduced capacity.
              Check the pod: `kubectl -n metis logs deploy/metis --tail=100`.
              If it is crash-looping on startup, the usual causes are a database
              it cannot reach and a refused secret — both say so on the first
              line.

        # MetisDown above depends on your scrape job being named something
        # containing "metis". If it is not, that rule matches nothing and stays
        # silent forever — which is the failure mode this whole file exists to
        # avoid, arriving through a label rather than a threshold.
        #
        # This one keys on a metric only Metis exports, so it holds whatever the
        # job is called. It is the backstop, not the primary: it cannot tell you
        # which instance went away, which is why MetisDown is worth naming your
        # job for.
        #
        # It is also the more robust of the two, for a reason worth knowing
        # before you rely on either. A scenario test against a live Prometheus
        # on a heavily loaded machine produced scrape gaps longer than the
        # five-minute lookback: `up` went absent rather than zero, so MetisDown
        # had no data to evaluate and sat in `pending` for 28 minutes of a real
        # outage, its timer resetting. This rule fired correctly throughout,
        # because absence is exactly what it looks for.
        #
        # The conditions that starve a scrape are the conditions that take an
        # engine down, so on the worst day the backstop is the one that pages.
        - alert: MetisMetricsMissing
          expr: absent(metis_http_requests_in_flight)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: No Metis metrics are being collected
            description: >-
              Nothing has exported metis_http_requests_in_flight for 5 minutes.
              Either the server is gone — see MetisDown, which says which
              instance — or nothing is scraping it. If MetisDown is silent while
              this is firing, your scrape job is not named what MetisDown looks
              for and that rule is not protecting you.

        - alert: MetisErrorBudgetBurning
          # The roadmap allows 0.1% of responses to be 5xx. Measured over an
          # hour rather than five minutes: this is a budget, and a budget that
          # alerts on a single bad minute is a pager that gets ignored.
          expr: >-
            sum(rate(metis_http_requests_total{status_class="5xx"}[1h]))
            /
            sum(rate(metis_http_requests_total[1h]))
            > 0.001
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: Metis is over its 0.1% 5xx error budget
            description: >-
              {{ $value | humanizePercentage }} of responses are 5xx over the
              last hour, against a 0.1% budget. A 5xx here is usually the engine
              failing to advance work rather than a read failing, so check
              incidents before latency: `GET /api/v1/incidents`.

    - name: metis.latency
      rules:
        - alert: MetisReadLatencyOverTarget
          # Reads are the endpoints a person waits on. 150ms is the §1 target,
          # and a load test at 500k instances measured p95 under 5ms — so this
          # firing means something changed in kind, not a system under load.
          expr: >-
            histogram_quantile(0.95,
              sum by (le) (rate(metis_http_request_duration_seconds_bucket{method="GET"}[10m]))
            ) > 0.15
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Read p95 is over the 150ms target
            description: >-
              p95 is {{ $value | humanizeDuration }}. At 500k instances this
              measured under 5ms, so 150ms is not "busy" — look for a query
              whose plan changed, a missing index after a migration, or a
              database that has stopped being able to keep its working set in
              memory.

        - alert: MetisActionLatencyOverTarget
          expr: >-
            histogram_quantile(0.95,
              sum by (le) (rate(metis_http_request_duration_seconds_bucket{method=~"POST|PUT|DELETE"}[10m]))
            ) > 0.5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Workflow action p95 is over the 500ms target
            description: >-
              p95 is {{ $value | humanizeDuration }}. Actions write, so this is
              usually lock contention or a slow downstream inside a service
              task rather than the API itself.

    - name: metis.saturation
      rules:
        - alert: MetisSaturated
          # The backpressure interceptor queues past its in-flight limit and
          # then refuses. Sitting near the limit means the next burst is
          # refused, which is why this warns before anything has failed.
          expr: metis_http_requests_in_flight > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Metis is close to its in-flight request limit
            description: >-
              {{ $value }} requests in flight. Past the limit the backpressure
              interceptor refuses rather than queueing without bound, so this
              is the warning before 503s. One replica is the supported
              topology, so the answer is usually a slow dependency rather than
              adding replicas — see docs/recovery.md §2.1 before scaling out.

        - alert: MetisNoTraffic
          # Silence is ambiguous and worth surfacing, because the failure this
          # catches does not produce errors: a job worker that stopped claiming
          # looks exactly like a system with nothing to do.
          expr: sum(rate(metis_http_requests_total[15m])) == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Metis has served no requests for 15 minutes
            description: >-
              Expected outside working hours and suspicious inside them. This
              exists because the alarming failures here are quiet ones — a
              worker that stopped claiming jobs, or a tenant scope answering
              every query with nothing, both look like an idle system.

        - alert: MetisSchemaDrift
          # The failure this exists for is silent by construction: a model
          # shipped without its migration means the feature behind it answers
          # every request with a 500, while /readyz stays green because it only
          # pings the database. The signed-webhook receiver shipped that way and
          # was broken on every installation for four releases without paging
          # anyone.
          expr: metis_schema_drift_items > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Metis is missing a database migration
            description: >-
              {{ $value }} model change(s) have no migration, so the tables or
              columns behind them do not exist and the features that use them
              return 500. Startup logs each one: `kubectl -n metis logs
              deploy/metis | grep "Schema drift"`. The fix is a numbered
              migration, not a restart — see docs/runbooks.md.

    - name: metis.tenancy
      rules:
        - alert: MetisStrictTenantScopeDenied
          # For the strict scope's staging soak (docs/strict-tenant-scope.md);
          # silent while the flag is off, because nothing is denied then.
          #
          # Matched per instance, and it has to be said. The version first
          # published was `enabled == 1 and count(denied_site) > 0`: `count`
          # drops every label and a plain `and` matches on labels, so the right
          # side matched no series on the left and the alert could never fire.
          expr: >-
            count by (job, instance) (metis_strict_tenant_scope_denied_site) > 0
            and on (job, instance)
            metis_strict_tenant_scope_enabled == 1
          labels:
            severity: warning
          annotations:
            summary: A code path reached a repository with neither a tenant nor a system identity
            description: >-
              {{ $value }} call site(s) on {{ $labels.instance }} were denied by
              the strict tenant scope and got nothing back. Each is a path that
              has to carry an identity before the flag can stay on. The sites
              are listed on the metrics endpoint as
              metis_strict_tenant_scope_denied_site{site=...}, and in the log as
              "A repository query carried neither a tenant nor a system identity". See docs/strict-tenant-scope.md.

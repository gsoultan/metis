# Unit tests for alerts.yaml, run by `promtool test rules`.
#
# An alerting rule that has never fired is decoration. Syntax checking proves
# the PromQL parses, which is not the same as proving it matches anything: a
# label that does not exist, a ratio whose denominator is empty, or a threshold
# on the wrong side all parse perfectly and stay silent forever.
#
# The series below use the label sets a real server actually exposes — checked
# against a running instance rather than assumed:
#
#   metis_http_requests_total{method,route,status_class}
#   metis_http_request_duration_seconds_bucket{method,route,status,le}
#   metis_http_requests_in_flight
#   metis_engine_state_up, metis_jobs_*, metis_incidents_open
#     {environment,environment_name} on an environment's series; neither on
#     the main database's, whose empty values Prometheus drops on ingestion
#
#   make alerts-test
rule_files:
  - /tmp/rules.yaml

evaluation_interval: 1m

tests:
  # --------------------------------------------------------------- availability
  - interval: 1m
    name: a scrape that stops firing MetisDown
    input_series:
      - series: 'up{job="metis", instance="10.0.0.1:9464"}'
        values: '1 1 1 0 0 0 0'
    alert_rule_test:
      # Two minutes of absence is inside `for: 2m`, so nothing yet.
      - eval_time: 4m
        alertname: MetisDown
        exp_alerts: []
      - eval_time: 6m
        alertname: MetisDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: metis
              instance: 10.0.0.1:9464
            exp_annotations:
              summary: Metis is not being scraped
              description: >-
                No metrics for 2 minutes. One replica is the supported topology, so this is a full outage rather than reduced capacity. Check the pod: `kubectl -n metis logs deploy/metis --tail=100`. If it is crash-looping on startup, the usual causes are a database it cannot reach and a refused secret — both say so on the first line.

  - interval: 1m
    name: a healthy scrape stays quiet
    input_series:
      - series: 'up{job="metis", instance="10.0.0.1:9464"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: MetisDown
        exp_alerts: []

  # -------------------------------------------------------------- error budget
  - interval: 1m
    name: 5xx over the budget fires
    input_series:
      # 2 of every 100 responses are 5xx — twenty times the 0.1% budget.
      - series: 'metis_http_requests_total{status_class="5xx", method="POST", route="/api/v1/process/start"}'
        values: '0+2x90'
      - series: 'metis_http_requests_total{status_class="2xx", method="POST", route="/api/v1/process/start"}'
        values: '0+98x90'
    alert_rule_test:
      - eval_time: 80m
        alertname: MetisErrorBudgetBurning
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Metis is spending its 5xx error budget fourteen times too fast
              description: >-
                2% of responses were 5xx over the last hour; the budget is 0.1%. At this rate a month's budget is gone in about two days. A 5xx here is usually the engine failing to advance work rather than a read failing, so check open incidents before latency: docs/runbooks.md, "Incidents are piling up".

  - interval: 1m
    name: an error rate inside the budget stays quiet
    input_series:
      # One 5xx in 10,000 — a tenth of the budget.
      - series: 'metis_http_requests_total{status_class="5xx", method="POST", route="/api/v1/process/start"}'
        values: '0+1x90'
      - series: 'metis_http_requests_total{status_class="2xx", method="POST", route="/api/v1/process/start"}'
        values: '0+9999x90'
    alert_rule_test:
      - eval_time: 80m
        alertname: MetisErrorBudgetBurning
        exp_alerts: []
      - eval_time: 80m
        alertname: MetisErrorBudgetSlowBurn
        exp_alerts: []

  - interval: 1m
    name: a slow burn warns without paging
    input_series:
      # 0.8% 5xx — eight times the budget: under the fast burn's fourteen, over
      # the slow burn's six.
      - series: 'metis_http_requests_total{status_class="5xx", method="POST", route="/api/v1/process/start"}'
        values: '0+8x420'
      - series: 'metis_http_requests_total{status_class="2xx", method="POST", route="/api/v1/process/start"}'
        values: '0+992x420'
    alert_rule_test:
      - eval_time: 7h
        alertname: MetisErrorBudgetBurning
        exp_alerts: []
      - eval_time: 7h
        alertname: MetisErrorBudgetSlowBurn
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Metis is spending its 5xx error budget six times too fast
              description: >-
                0.8% of responses were 5xx over six hours, against a 0.1% budget — a month's budget in five days. Slow enough to look into during working hours, fast enough that it will not wait: find the route with `sum by (route) (rate(metis_http_requests_total{status_class="5xx"}[6h]))`.

  - interval: 1m
    name: a steady rate over the budget becomes a ticket
    input_series:
      # 0.2%, for three days: too slow for either burn alert, and still twice
      # what a month allows.
      - series: 'metis_http_requests_total{status_class="5xx", method="POST", route="/api/v1/process/start"}'
        values: '0+2x4400'
      - series: 'metis_http_requests_total{status_class="2xx", method="POST", route="/api/v1/process/start"}'
        values: '0+998x4400'
    alert_rule_test:
      - eval_time: 73h
        alertname: MetisErrorBudgetSlowBurn
        exp_alerts: []
      - eval_time: 73h
        alertname: MetisErrorBudgetExhausting
        exp_alerts:
          - exp_labels:
              severity: info
            exp_annotations:
              summary: Metis has been over its 5xx error budget for three days
              description: >-
                The error ratio has averaged 0.2% for three days, against 0.1%. Nothing is burning fast enough to page, and the month's budget is still being spent. Worth a ticket for the routes that contribute most.

  # ------------------------------------------------------------------- latency
  - interval: 1m
    name: slow reads fire the read-latency alert
    input_series:
      # Everything lands in the 1s bucket and above: p95 is far past 150ms.
      - series: 'metis_http_request_duration_seconds_bucket{le="0.005", method="GET", route="/api/v1/tasks", status="200"}'
        values: '0+0x40'
      - series: 'metis_http_request_duration_seconds_bucket{le="0.15", method="GET", route="/api/v1/tasks", status="200"}'
        values: '0+0x40'
      - series: 'metis_http_request_duration_seconds_bucket{le="1", method="GET", route="/api/v1/tasks", status="200"}'
        values: '0+100x40'
      - series: 'metis_http_request_duration_seconds_bucket{le="+Inf", method="GET", route="/api/v1/tasks", status="200"}'
        values: '0+100x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: MetisReadLatencyOverTarget
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Read p95 is over the 150ms target
              description: >-
                p95 is 957.5ms. At 500k instances this measured under 5ms, so 150ms is not "busy" — look for a query whose plan changed, a missing index after a migration, or a database that has stopped being able to keep its working set in memory.

  - interval: 1m
    name: fast reads stay quiet
    input_series:
      - series: 'metis_http_request_duration_seconds_bucket{le="0.005", method="GET", route="/api/v1/tasks", status="200"}'
        values: '0+100x40'
      - series: 'metis_http_request_duration_seconds_bucket{le="0.15", method="GET", route="/api/v1/tasks", status="200"}'
        values: '0+100x40'
      - series: 'metis_http_request_duration_seconds_bucket{le="1", method="GET", route="/api/v1/tasks", status="200"}'
        values: '0+100x40'
      - series: 'metis_http_request_duration_seconds_bucket{le="+Inf", method="GET", route="/api/v1/tasks", status="200"}'
        values: '0+100x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: MetisReadLatencyOverTarget
        exp_alerts: []

  - interval: 1m
    name: slow writes fire the action-latency alert
    input_series:
      - series: 'metis_http_request_duration_seconds_bucket{le="0.5", method="POST", route="/api/v1/process/start", status="200"}'
        values: '0+0x40'
      - series: 'metis_http_request_duration_seconds_bucket{le="2.5", method="POST", route="/api/v1/process/start", status="200"}'
        values: '0+100x40'
      - series: 'metis_http_request_duration_seconds_bucket{le="+Inf", method="POST", route="/api/v1/process/start", status="200"}'
        values: '0+100x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: MetisActionLatencyOverTarget
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Workflow action p95 is over the 500ms target
              description: >-
                p95 is 2.4s. Actions write, so this is usually lock contention or a slow downstream inside a service task rather than the API itself.

  # ---------------------------------------------------------------- saturation
  - interval: 1m
    name: sitting near the in-flight limit fires
    input_series:
      - series: 'metis_http_requests_in_flight'
        values: '90+0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: MetisSaturated
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Metis is close to its in-flight request limit
              description: >-
                90 requests in flight. Past the limit the backpressure interceptor refuses rather than queueing without bound, so this is the warning before 503s. One replica is the supported topology, so the answer is usually a slow dependency rather than adding replicas — see docs/recovery.md §2.1 before scaling out.

  - interval: 1m
    name: silence fires MetisNoTraffic
    input_series:
      # Served requests, then nothing: the counter stops advancing.
      - series: 'metis_http_requests_total{status_class="2xx", method="GET", route="/api/v1/tasks"}'
        values: '0+10x10 100+0x30'
    alert_rule_test:
      - eval_time: 40m
        alertname: MetisNoTraffic
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Metis has served no requests for 15 minutes
              description: >-
                Expected outside working hours and suspicious inside them. This exists because the alarming failures here are quiet ones — a worker that stopped claiming jobs, or a tenant scope answering every query with nothing, both look like an idle system.

  # The backstop for a scrape job named something MetisDown does not match.
  - interval: 1m
    name: metrics disappearing fires the backstop
    input_series:
      - series: 'metis_http_requests_in_flight'
        values: '0 0 0 _ _ _ _ _ _ _ _ _ _ _ _ _ _ _'
    alert_rule_test:
      - eval_time: 2m
        alertname: MetisMetricsMissing
        exp_alerts: []
      # The series goes stale five minutes after its last sample, and `for: 5m`
      # runs from there — so the earliest this can fire is about twelve minutes
      # in, not seven. Getting that wrong is how a test concludes a working rule
      # is broken.
      - eval_time: 14m
        alertname: MetisMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: No Metis metrics are being collected
              description: >-
                Nothing has exported metis_http_requests_in_flight for 5 minutes. Either the server is gone — see MetisDown, which says which instance — or nothing is scraping it. If MetisDown is silent while this is firing, your scrape job is not named what MetisDown looks for and that rule is not protecting you.

  - interval: 1m
    name: metrics present keep the backstop quiet
    input_series:
      - series: 'metis_http_requests_in_flight'
        values: '3+0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: MetisMetricsMissing
        exp_alerts: []

  # ------------------------------------------------------------- schema drift
  - interval: 1m
    name: a missing migration fires MetisSchemaDrift
    input_series:
      # Two model changes with no migration: the shape a release that forgot one
      # actually produces. This failure is otherwise silent — the features
      # behind those tables return 500 while /readyz stays green.
      - series: 'metis_schema_drift_items'
        values: '2+0x15'
    alert_rule_test:
      # Inside `for: 5m`, so nothing yet.
      - eval_time: 4m
        alertname: MetisSchemaDrift
        exp_alerts: []
      - eval_time: 6m
        alertname: MetisSchemaDrift
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Metis is missing a database migration
              description: >-
                2 model change(s) have no migration, so the tables or columns behind them do not exist and the features that use them return 500. Startup logs each one: `kubectl -n metis logs deploy/metis | grep "Schema drift"`. The fix is a numbered migration, not a restart — see docs/runbooks.md.

  - interval: 1m
    name: a schema that matches its models stays quiet
    input_series:
      - series: 'metis_schema_drift_items'
        values: '0+0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: MetisSchemaDrift
        exp_alerts: []

  # -------------------------------------------------------------- tenancy
  - interval: 1m
    name: a denied call site fires while the strict scope is on
    input_series:
      - series: 'metis_strict_tenant_scope_enabled{job="metis", instance="10.0.0.1:9464"}'
        values: '1+0x10'
      - series: 'metis_strict_tenant_scope_denied_site{job="metis", instance="10.0.0.1:9464", site="impl.(*Engine).GetInstanceForUpdate (engine.go:189)"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: MetisStrictTenantScopeDenied
        exp_alerts:
          - exp_labels:
              severity: warning
              job: metis
              instance: 10.0.0.1:9464
            exp_annotations:
              summary: A code path reached a repository with neither a tenant nor a system identity
              description: >-
                1 call site(s) on 10.0.0.1:9464 were denied by the strict tenant scope and got nothing back. Each is a path that has to carry an identity before the flag can stay on. The sites are listed on the metrics endpoint as metis_strict_tenant_scope_denied_site{site=...}, and in the log as "A repository query carried neither a tenant nor a system identity". See docs/strict-tenant-scope.md.

  - interval: 1m
    name: with the strict scope off nothing fires
    input_series:
      - series: 'metis_strict_tenant_scope_enabled{job="metis", instance="10.0.0.1:9464"}'
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: MetisStrictTenantScopeDenied
        exp_alerts: []

  # -------------------------------------------------------------- engine
  - interval: 1m
    name: jobs nobody claims fire MetisJobsWaitingUnclaimed
    input_series:
      # The oldest due job ages a minute every minute: nothing is claiming.
      - series: 'metis_jobs_oldest_due_age_seconds{job="metis", instance="10.0.0.1:9464"}'
        values: '0+60x30'
    alert_rule_test:
      # Over ten minutes from 11m, and `for: 5m` after that.
      - eval_time: 15m
        alertname: MetisJobsWaitingUnclaimed
        exp_alerts: []
      - eval_time: 17m
        alertname: MetisJobsWaitingUnclaimed
        exp_alerts:
          - exp_labels:
              severity: critical
              job: metis
              instance: 10.0.0.1:9464
            exp_annotations:
              summary: Due jobs have waited more than ten minutes for a worker
              description: >-
                The oldest due job has waited 17m 0s. Timers are late and service tasks are not running. See docs/runbooks.md, "Jobs are due and nobody is claiming them".

  - interval: 1m
    name: a queue that keeps up stays quiet
    input_series:
      - series: 'metis_jobs_oldest_due_age_seconds{job="metis", instance="10.0.0.1:9464"}'
        values: '0 2 0 1 0 3 0+0x25'
    alert_rule_test:
      - eval_time: 30m
        alertname: MetisJobsWaitingUnclaimed
        exp_alerts: []

  - interval: 1m
    name: expired leases nobody reclaims fire MetisJobLeasesNotReclaimed
    input_series:
      - series: 'metis_jobs_lease_expired{job="metis", instance="10.0.0.1:9464"}'
        values: '0 0 2+0x30'
    alert_rule_test:
      - eval_time: 18m
        alertname: MetisJobLeasesNotReclaimed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: metis
              instance: 10.0.0.1:9464
            exp_annotations:
              summary: Jobs with expired leases are not being reclaimed
              description: >-
                2 job(s) were claimed by a worker that stopped renewing them, and no worker has taken them back for 15 minutes. See docs/runbooks.md, "A job stuck in running".

  - interval: 1m
    name: a lease reclaimed on the next poll stays quiet
    input_series:
      - series: 'metis_jobs_lease_expired{job="metis", instance="10.0.0.1:9464"}'
        values: '0 3 0+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: MetisJobLeasesNotReclaimed
        exp_alerts: []

  - interval: 1m
    name: incidents opening faster than they close fire MetisIncidentsRising
    input_series:
      - series: 'metis_incidents_open{job="metis", instance="10.0.0.1:9464"}'
        values: '4x30 40+0x30'
    alert_rule_test:
      - eval_time: 40m
        alertname: MetisIncidentsRising
        exp_alerts:
          - exp_labels:
              severity: warning
              job: metis
              instance: 10.0.0.1:9464
            exp_annotations:
              summary: Incidents are being opened faster than they are resolved
              description: >-
                37 more incidents are open than half an hour ago. They usually share a cause. See docs/runbooks.md, "Incidents are piling up".

  - interval: 1m
    name: a steady handful of incidents stays quiet
    input_series:
      - series: 'metis_incidents_open{job="metis", instance="10.0.0.1:9464"}'
        values: '4 5 4 6 5 4+0x30'
    alert_rule_test:
      - eval_time: 35m
        alertname: MetisIncidentsRising
        exp_alerts: []

  - interval: 1m
    name: an unreadable backlog fires MetisEngineStateUnreadable
    input_series:
      - series: 'metis_engine_state_up{job="metis", instance="10.0.0.1:9464"}'
        values: '1 1 0+0x20'
    alert_rule_test:
      - eval_time: 13m
        alertname: MetisEngineStateUnreadable
        exp_alerts:
          - exp_labels:
              severity: warning
              job: metis
              instance: 10.0.0.1:9464
            exp_annotations:
              summary: The engine's backlog cannot be read
              description: >-
                The metrics endpoint on 10.0.0.1:9464 has not been able to read the job queue or the incidents for 10 minutes, so the alerts on them cannot fire. The server logs "Could not read the engine's backlog for the metrics endpoint" with the reason.

  # ------------------------------------------------------ an environment's engine
  # Each environment's backlog is its own set of series, labelled with its id
  # and its name; the main database's carries neither. The main database's
  # series stay healthy in each case below, so what fires is the environment
  # alone, and the description names it.
  - interval: 1m
    name: an environment whose jobs nobody claims fires for that environment alone
    input_series:
      - series: 'metis_jobs_oldest_due_age_seconds{job="metis", instance="10.0.0.1:9464"}'
        values: '0+0x30'
      - series: 'metis_jobs_oldest_due_age_seconds{job="metis", instance="10.0.0.1:9464", environment="0199a1b2-0000-7000-8000-000000000001", environment_name="staging"}'
        values: '0+60x30'
    alert_rule_test:
      - eval_time: 17m
        alertname: MetisJobsWaitingUnclaimed
        exp_alerts:
          - exp_labels:
              severity: critical
              job: metis
              instance: 10.0.0.1:9464
              environment: 0199a1b2-0000-7000-8000-000000000001
              environment_name: staging
            exp_annotations:
              summary: Due jobs have waited more than ten minutes for a worker
              description: >-
                In the staging environment (0199a1b2-0000-7000-8000-000000000001), the oldest due job has waited 17m 0s. Timers are late and service tasks are not running. See docs/runbooks.md, "Jobs are due and nobody is claiming them".

  - interval: 1m
    name: an environment's expired leases name the environment
    input_series:
      - series: 'metis_jobs_lease_expired{job="metis", instance="10.0.0.1:9464"}'
        values: '0+0x30'
      - series: 'metis_jobs_lease_expired{job="metis", instance="10.0.0.1:9464", environment="0199a1b2-0000-7000-8000-000000000001", environment_name="staging"}'
        values: '0 0 2+0x30'
    alert_rule_test:
      - eval_time: 18m
        alertname: MetisJobLeasesNotReclaimed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: metis
              instance: 10.0.0.1:9464
              environment: 0199a1b2-0000-7000-8000-000000000001
              environment_name: staging
            exp_annotations:
              summary: Jobs with expired leases are not being reclaimed
              description: >-
                2 job(s) in the staging environment (0199a1b2-0000-7000-8000-000000000001) were claimed by a worker that stopped renewing them, and no worker has taken them back for 15 minutes. See docs/runbooks.md, "A job stuck in running".

  - interval: 1m
    name: incidents piling up in an environment name the environment
    input_series:
      - series: 'metis_incidents_open{job="metis", instance="10.0.0.1:9464"}'
        values: '4+0x60'
      - series: 'metis_incidents_open{job="metis", instance="10.0.0.1:9464", environment="0199a1b2-0000-7000-8000-000000000001", environment_name="staging"}'
        values: '4x30 40+0x30'
    alert_rule_test:
      - eval_time: 40m
        alertname: MetisIncidentsRising
        exp_alerts:
          - exp_labels:
              severity: warning
              job: metis
              instance: 10.0.0.1:9464
              environment: 0199a1b2-0000-7000-8000-000000000001
              environment_name: staging
            exp_annotations:
              summary: Incidents are being opened faster than they are resolved
              description: >-
                37 more incidents are open in the staging environment (0199a1b2-0000-7000-8000-000000000001) than half an hour ago. They usually share a cause. See docs/runbooks.md, "Incidents are piling up".

  - interval: 1m
    name: an environment that cannot be read is down on its own
    input_series:
      - series: 'metis_engine_state_up{job="metis", instance="10.0.0.1:9464"}'
        values: '1+0x20'
      - series: 'metis_engine_state_up{job="metis", instance="10.0.0.1:9464", environment="0199a1b2-0000-7000-8000-000000000001", environment_name="staging"}'
        values: '1 1 0+0x20'
      - series: 'metis_engine_state_up{job="metis", instance="10.0.0.1:9464", environment="0199a1b2-0000-7000-8000-000000000002", environment_name="production"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 13m
        alertname: MetisEngineStateUnreadable
        exp_alerts:
          - exp_labels:
              severity: warning
              job: metis
              instance: 10.0.0.1:9464
              environment: 0199a1b2-0000-7000-8000-000000000001
              environment_name: staging
            exp_annotations:
              summary: The engine's backlog cannot be read
              description: >-
                The metrics endpoint on 10.0.0.1:9464 has not been able to read the job queue or the incidents of the staging environment (0199a1b2-0000-7000-8000-000000000001) for 10 minutes, so the alerts on them cannot fire. The server logs "Could not read the engine's backlog for the metrics endpoint" with the reason, or, for an environment it could not start, "This environment could not be started" once per reason.

  - interval: 1m
    name: a pool that is full and making callers wait fires
    input_series:
      - series: 'metis_db_pool_connections{job="metis", instance="10.0.0.1:9464", pool="storm", state="acquired"}'
        values: '19+0x20'
      - series: 'metis_db_pool_connections{job="metis", instance="10.0.0.1:9464", pool="storm", state="idle"}'
        values: '1+0x20'
      - series: 'metis_db_pool_max_connections{job="metis", instance="10.0.0.1:9464", pool="storm"}'
        values: '20+0x20'
      - series: 'metis_db_pool_acquire_waits_total{job="metis", instance="10.0.0.1:9464", pool="storm"}'
        values: '0+3x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: MetisDatabasePoolSaturated
        exp_alerts:
          - exp_labels:
              severity: warning
              job: metis
              instance: 10.0.0.1:9464
              pool: storm
            exp_annotations:
              summary: The database connection pool is nearly exhausted
              description: >-
                95% of the storm pool's connections are in use on 10.0.0.1:9464, and requests are waiting for one. See docs/runbooks.md, "The database pool is exhausted".

  - interval: 1m
    name: a busy pool nobody waits on stays quiet
    input_series:
      - series: 'metis_db_pool_connections{job="metis", instance="10.0.0.1:9464", pool="storm", state="acquired"}'
        values: '19+0x20'
      - series: 'metis_db_pool_max_connections{job="metis", instance="10.0.0.1:9464", pool="storm"}'
        values: '20+0x20'
      - series: 'metis_db_pool_acquire_waits_total{job="metis", instance="10.0.0.1:9464", pool="storm"}'
        values: '5+0x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: MetisDatabasePoolSaturated
        exp_alerts: []

  # --------------------------------------------------------------------- canary
  # A canary serves a share of the traffic on the next release. Its pods carry
  # track=canary and the stable ones track=stable; Prometheus copies the label
  # onto every series (see deploy/kubernetes/README.md).
  - interval: 1m
    name: a canary answering far more 5xx than stable fires MetisCanaryErrorsAboveStable
    input_series:
      # Stable: 1000 requests a minute, 1 of them a 5xx (0.1%).
      - series: 'metis_http_requests_total{job="metis", track="stable", method="GET", route="/api/v1/tasks", status_class="2xx"}'
        values: '0+999x40'
      - series: 'metis_http_requests_total{job="metis", track="stable", method="GET", route="/api/v1/tasks", status_class="5xx"}'
        values: '0+1x40'
      # Canary: 100 requests a minute, 5 of them 5xx (5%).
      - series: 'metis_http_requests_total{job="metis", track="canary", method="GET", route="/api/v1/tasks", status_class="2xx"}'
        values: '0+95x40'
      - series: 'metis_http_requests_total{job="metis", track="canary", method="GET", route="/api/v1/tasks", status_class="5xx"}'
        values: '0+5x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: MetisCanaryErrorsAboveStable
        exp_alerts:
          - exp_labels:
              severity: warning
              track: canary
            exp_annotations:
              summary: "The canary answers 5xx at more than twice the stable track's rate"
              description: >-
                Over the last 10 minutes the canary answered 5% of its requests
                with a 5xx, against 0.1% on the stable track. Stop the rollout:
                docs/runbooks.md, "A canary is failing".

  - interval: 1m
    name: a canary no worse than stable stays quiet
    input_series:
      - series: 'metis_http_requests_total{job="metis", track="stable", method="GET", route="/api/v1/tasks", status_class="2xx"}'
        values: '0+995x40'
      - series: 'metis_http_requests_total{job="metis", track="stable", method="GET", route="/api/v1/tasks", status_class="5xx"}'
        values: '0+5x40'
      - series: 'metis_http_requests_total{job="metis", track="canary", method="GET", route="/api/v1/tasks", status_class="2xx"}'
        values: '0+199x40'
      - series: 'metis_http_requests_total{job="metis", track="canary", method="GET", route="/api/v1/tasks", status_class="5xx"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: MetisCanaryErrorsAboveStable
        exp_alerts: []

  # A counter series exists only once it has been counted, so a stable track
  # that has not answered a single 5xx has no 5xx series at all. That is the
  # healthy case, and the comparison must still have a stable rate of 0 to
  # compare the canary against rather than nothing.
  - interval: 1m
    name: a failing canary fires beside a stable track that has never answered a 5xx
    input_series:
      - series: 'metis_http_requests_total{job="metis", track="stable", method="GET", route="/api/v1/tasks", status_class="2xx"}'
        values: '0+1000x40'
      - series: 'metis_http_requests_total{job="metis", track="canary", method="GET", route="/api/v1/tasks", status_class="2xx"}'
        values: '0+90x40'
      - series: 'metis_http_requests_total{job="metis", track="canary", method="GET", route="/api/v1/tasks", status_class="5xx"}'
        values: '0+10x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: MetisCanaryErrorsAboveStable
        exp_alerts:
          - exp_labels:
              severity: warning
              track: canary
            exp_annotations:
              summary: "The canary answers 5xx at more than twice the stable track's rate"
              description: >-
                Over the last 10 minutes the canary answered 10% of its requests
                with a 5xx, against 0% on the stable track. Stop the rollout:
                docs/runbooks.md, "A canary is failing".

  - interval: 1m
    name: a canary reading far slower than stable fires MetisCanarySlowerThanStable
    input_series:
      - series: 'metis_http_request_duration_seconds_bucket{job="metis", track="stable", le="0.005", method="GET", route="/api/v1/tasks", status="200"}'
        values: '0+100x40'
      - series: 'metis_http_request_duration_seconds_bucket{job="metis", track="stable", le="0.15", method="GET", route="/api/v1/tasks", status="200"}'
        values: '0+100x40'
      - series: 'metis_http_request_duration_seconds_bucket{job="metis", track="stable", le="1", method="GET", route="/api/v1/tasks", status="200"}'
        values: '0+100x40'
      - series: 'metis_http_request_duration_seconds_bucket{job="metis", track="stable", le="+Inf", method="GET", route="/api/v1/tasks", status="200"}'
        values: '0+100x40'
      - series: 'metis_http_request_duration_seconds_bucket{job="metis", track="canary", le="0.005", method="GET", route="/api/v1/tasks", status="200"}'
        values: '0+0x40'
      - series: 'metis_http_request_duration_seconds_bucket{job="metis", track="canary", le="0.15", method="GET", route="/api/v1/tasks", status="200"}'
        values: '0+0x40'
      - series: 'metis_http_request_duration_seconds_bucket{job="metis", track="canary", le="1", method="GET", route="/api/v1/tasks", status="200"}'
        values: '0+100x40'
      - series: 'metis_http_request_duration_seconds_bucket{job="metis", track="canary", le="+Inf", method="GET", route="/api/v1/tasks", status="200"}'
        values: '0+100x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: MetisCanarySlowerThanStable
        exp_alerts:
          - exp_labels:
              severity: warning
              track: canary
            exp_annotations:
              summary: "The canary's reads are over the 150ms target and twice as slow as stable's"
              description: >-
                Read p95 on the canary is 957.5ms, against 4.75ms on the stable
                track. Stop the rollout: docs/runbooks.md, "A canary is failing".

  - interval: 1m
    name: a canary reading as fast as stable stays quiet
    input_series:
      - series: 'metis_http_request_duration_seconds_bucket{job="metis", track="stable", le="0.005", method="GET", route="/api/v1/tasks", status="200"}'
        values: '0+100x40'
      - series: 'metis_http_request_duration_seconds_bucket{job="metis", track="stable", le="0.15", method="GET", route="/api/v1/tasks", status="200"}'
        values: '0+100x40'
      - series: 'metis_http_request_duration_seconds_bucket{job="metis", track="stable", le="1", method="GET", route="/api/v1/tasks", status="200"}'
        values: '0+100x40'
      - series: 'metis_http_request_duration_seconds_bucket{job="metis", track="stable", le="+Inf", method="GET", route="/api/v1/tasks", status="200"}'
        values: '0+100x40'
      - series: 'metis_http_request_duration_seconds_bucket{job="metis", track="canary", le="0.005", method="GET", route="/api/v1/tasks", status="200"}'
        values: '0+100x40'
      - series: 'metis_http_request_duration_seconds_bucket{job="metis", track="canary", le="0.15", method="GET", route="/api/v1/tasks", status="200"}'
        values: '0+100x40'
      - series: 'metis_http_request_duration_seconds_bucket{job="metis", track="canary", le="1", method="GET", route="/api/v1/tasks", status="200"}'
        values: '0+100x40'
      - series: 'metis_http_request_duration_seconds_bucket{job="metis", track="canary", le="+Inf", method="GET", route="/api/v1/tasks", status="200"}'
        values: '0+100x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: MetisCanarySlowerThanStable
        exp_alerts: []

  # Slow on both tracks is the database or the load, not the release, and
  # MetisReadLatencyOverTarget is the alert for that.
  - interval: 1m
    name: a canary as slow as a slow stable track stays quiet
    input_series:
      - series: 'metis_http_request_duration_seconds_bucket{job="metis", track="stable", le="0.005", method="GET", route="/api/v1/tasks", status="200"}'
        values: '0+0x40'
      - series: 'metis_http_request_duration_seconds_bucket{job="metis", track="stable", le="0.15", method="GET", route="/api/v1/tasks", status="200"}'
        values: '0+0x40'
      - series: 'metis_http_request_duration_seconds_bucket{job="metis", track="stable", le="1", method="GET", route="/api/v1/tasks", status="200"}'
        values: '0+100x40'
      - series: 'metis_http_request_duration_seconds_bucket{job="metis", track="stable", le="+Inf", method="GET", route="/api/v1/tasks", status="200"}'
        values: '0+100x40'
      - series: 'metis_http_request_duration_seconds_bucket{job="metis", track="canary", le="0.005", method="GET", route="/api/v1/tasks", status="200"}'
        values: '0+0x40'
      - series: 'metis_http_request_duration_seconds_bucket{job="metis", track="canary", le="0.15", method="GET", route="/api/v1/tasks", status="200"}'
        values: '0+0x40'
      - series: 'metis_http_request_duration_seconds_bucket{job="metis", track="canary", le="1", method="GET", route="/api/v1/tasks", status="200"}'
        values: '0+100x40'
      - series: 'metis_http_request_duration_seconds_bucket{job="metis", track="canary", le="+Inf", method="GET", route="/api/v1/tasks", status="200"}'
        values: '0+100x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: MetisCanarySlowerThanStable
        exp_alerts: []

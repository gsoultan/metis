# What a tag publishes.
#
# Two artifacts, built from the same commit and stamped with the same version
# string: the container image, which is the supported way to run Metis, and
# Linux archives for anyone deploying a binary directly. They are independent
# jobs on purpose — a registry outage should not cost the release its tarballs,
# and vice versa.
#
# Deliberately tag-triggered and nothing else. Publishing on every push to main
# would mean the registry's newest tag is whatever merged last, which is a
# rollback target nobody chose — and an image is the one artifact people deploy
# without reading first.
#
# Both carry a software bill of materials and build provenance, and the image is
# signed as well. Between them they answer the three questions an operator asks
# about something they did not build — what is in it, where it came from, and
# whether it is the one that was published.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  # For keyless signing and the provenance attestation: both exchange this
  # workflow's OIDC identity for a short-lived certificate, so there is no
  # long-lived signing key to store or to leak.
  id-token: write
  attestations: write

jobs:
  image:
    name: Publish the image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # `git describe` stamps the version into the binary, and a shallow
          # clone has no tags to describe against — including the one that
          # triggered this run.
          fetch-depth: 0

      # The default buildx driver is `docker`, which cannot produce
      # attestations — `provenance: true` below fails outright against it. This
      # sets up the docker-container driver, which can.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: tags
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/metis"
          # `latest` only moves for a final release. A pre-release that quietly
          # became the default pull is how someone ends up running a release
          # candidate in production without having chosen to.
          if [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tags=${image}:${version},${image}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${image}:${version}" >> "$GITHUB_OUTPUT"
            echo "::notice::${version} is a pre-release, so 'latest' was left where it was."
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # arm64 as well as amd64: Graviton and Ampere are ordinary Kubernetes
          # nodes now, and every Apple Silicon developer is arm64 too. The
          # Dockerfile cross-compiles rather than emulating, so this is close to
          # free.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
          # Attest what this image was built from, so a deployed digest can be
          # traced back to a commit without trusting the tag.
          provenance: mode=max
          # A bill of materials, generated from the built image rather than from
          # the manifests, so it lists what is actually in the layers.
          sbom: true

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/metis
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image
        # Keyless: the signature is bound to this workflow's identity and
        # recorded in the public transparency log, so anybody can verify who
        # published a digest without us holding a private key anywhere.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/metis@${DIGEST}"

      - name: Say what to pull
        run: |
          {
            echo "### Published"
            echo '```'
            echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  binaries:
    name: Publish the archives
    runs-on: ubuntu-latest

    # Job-scoped, because they replace the workflow's defaults rather than
    # extending them: GoReleaser creates the GitHub Release and uploads to it,
    # which the workflow-level `contents: read` would refuse.
    permissions:
      contents: write
      # Keyless provenance over the archives, the same guarantee the image gets.
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # GoReleaser needs the tags to work out the version it is releasing,
          # and the commits since the last tag to write the changelog. A shallow
          # clone has neither.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Read from go.mod rather than pinned here: a second copy of the
          # version is a second thing to forget when it moves.
          go-version-file: go.mod

      # `bun run build` ends by running `node scripts/check-bundle-budget.mjs`,
      # and those budgets are tuned to within a kilobyte. With no node on PATH,
      # bun answers that call with its own shim, whose zlib compresses about
      # 0.8% worse — enough to fail the first-paint budget on a bundle whose
      # bytes are identical, and to fail a release for it. See the same note in
      # security_reliability_ci.yml.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      # GoReleaser shells out to syft for the per-archive bill of materials.
      # Without it on PATH the sboms step fails the release outright rather than
      # quietly publishing archives nobody can inspect.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Build and publish
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest the archives
        # Same question the image's attestation answers, for the artifact people
        # download instead: which commit and which workflow produced these bytes.
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt

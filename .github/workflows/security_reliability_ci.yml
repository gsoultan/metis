name: Security and Reliability CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  GO_VERSION: '1.26.5'

jobs:
  ui:
    name: UI (typecheck, lint, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: ui

      # tsgo is the TypeScript 7 native compiler. typescript@5.9 is also
      # installed purely so typescript-eslint can run — see ui/TYPESCRIPT.md.
      - name: Typecheck
        run: bun run typecheck
        working-directory: ui

      - name: Lint
        run: bun run lint
        working-directory: ui

      - name: Test
        run: bun test
        working-directory: ui

      - name: Build
        run: bun run build
        working-directory: ui

      # The Go build embeds ui/dist (ui/embed.go). Publish it so the Go job
      # compiles the same assets rather than rebuilding them.
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 1

  go-security-reliability:
    name: Go (build, vet, race, vuln)
    needs: ui
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download UI dist
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

      - name: Download Go modules
        run: go mod download

      # Scope note: these run across the WHOLE module. They were previously
      # limited to a six-package allowlist, which is why 145 vet findings and
      # seven non-compiling test packages accumulated undetected. Do not
      # reintroduce an allowlist — narrow the code, not the check.
      - name: Build
        run: make build

      - name: Static analysis (go vet)
        run: make vet

      - name: Tests
        run: make test

      - name: Race detector
        run: make race

      - name: Vulnerability scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck $(go list ./... | grep -v '/node_modules/')

  golangci-lint:
    name: golangci-lint
    needs: ui
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download UI dist
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

      # only-new-issues blocks every NEW violation while the pre-existing
      # backlog (see .golangci.yml adoption note) is burned down by area.
      # Do not disable this to "get green" — narrow the backlog instead.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          only-new-issues: true

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2

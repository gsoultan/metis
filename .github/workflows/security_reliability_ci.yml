name: Security and Reliability CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  # Kept at or above 1.26.6, which carries the fix for GO-2026-6218 (quadratic
  # resolvePath in net/url). govulncheck reports that against the standard
  # library itself, so the version here is the fix — there is nothing to change
  # in this repository's code. 1.27.0 supersedes it.
  GO_VERSION: '1.27.0'

jobs:
  ui:
    name: UI (typecheck, lint, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # scripts/check-bundle-budget.mjs is invoked as `node ...`, and its budgets
      # are tuned to within a kilobyte of the current measurement. When no node
      # is on PATH, `bun run` answers that call with its own node shim, whose
      # zlib compresses about 0.8% worse than node's — enough to fail the
      # first-paint budget on a bundle whose bytes are identical. The hosted
      # runner had node preinstalled and hid this; a self-hosted one need not,
      # so the job asks for the runtime its budgets were measured with.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: ui

      # tsgo is the TypeScript 7 native compiler. typescript@5.9 is also
      # installed purely so typescript-eslint can run — see ui/TYPESCRIPT.md.
      - name: Typecheck
        run: bun run typecheck
        working-directory: ui

      - name: Lint
        run: bun run lint
        working-directory: ui

      - name: Test
        run: bun test
        working-directory: ui

      # `bun run build` runs the bundle budget as its final step, so a change
      # that pushes the first-paint payload past its ceiling fails here rather
      # than being noticed months later.
      - name: Build (includes bundle budget)
        run: bun run build

      # The Go side has had govulncheck since the beginning; the UI side had
      # nothing, and a first run found 23 advisories — thirteen of them high.
      # Every one was fixable within its existing range, which is the point:
      # they were not unfixable, nobody had looked.
      #
      # Most were build-time (eslint, babel, vite) rather than shipped code.
      # That lowers the severity and not the argument: a compromised build tool
      # ships compromised assets, and the whole UI is assets.
      - name: Dependency audit
        working-directory: ui
        run: bun audit

      # The Go build embeds ui/dist (ui/embed.go). Publish it so the Go job
      # compiles the same assets rather than rebuilding them.
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 1

  go-security-reliability:
    name: Go (build, vet, race, vuln)
    needs: ui
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Caching is left on, which is the right choice here and was the wrong
      # one on the self-hosted Mac this workflow used to run on. A hosted
      # runner is destroyed after the job and starts cold, so GOMODCACHE and
      # GOCACHE are worth restoring. On the Mac those directories were 23 GB
      # and 47 GB and already persisted between runs, so uploading them bought
      # nothing and cost plenty: the post-step tarred ~14 GB, was refused for
      # exceeding the 10 GB cache limit, and saturated the machine until four
      # jobs died with "the self-hosted runner lost communication with the
      # server" — after every real step had passed.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download UI dist
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

      - name: Download Go modules
        run: go mod download

      # Scope note: these run across the WHOLE module. They were previously
      # limited to a six-package allowlist, which is why 145 vet findings and
      # seven non-compiling test packages accumulated undetected. Do not
      # reintroduce an allowlist — narrow the code, not the check.
      - name: Build
        run: make build

      - name: Static analysis (go vet)
        run: make vet

      # -count=1 on both, and on the SDK below. This runner keeps GOCACHE
      # between jobs — 47 GB of it — so an unchanged tree returns "ok (cached)"
      # for every package and executes nothing. Measured on the run that added
      # this: all 93 packages cached, the whole suite and the race detector
      # "passed" in 33 seconds having run no tests. A hosted runner started
      # cold each time and could never do this, which is why it went unnoticed.
      #
      # The race detector has a second reason: it observes one interleaving per
      # run, so re-running is how it finds what the last run missed. A cached
      # race pass is not a race pass at all.
      #
      # The default stays cached for local runs; only CI opts out.
      - name: Tests
        run: make test GO_TEST_FLAGS=-count=1

      - name: Race detector
        run: make race GO_TEST_FLAGS=-count=1

      # The strict tenant scope is the security default we cannot flip yet:
      # it ships off because 106 existing test call sites enter the engine
      # directly and bypass the entry points where system identity is marked.
      # This suite is the evidence that the production paths — the real HTTP
      # chain and the job worker — do carry identity, so the flag can be turned
      # on in a staging environment without stranding work.
      #
      # Set through the environment rather than the test override, because that
      # is how an operator turns it on: it proves the variable name and the
      # resolution path, not just the in-process switch.
      - name: Strict tenant scope (production paths, flag on)
        env:
          METIS_FEATURE_STRICT_TENANT_SCOPE: "true"
        run: go test -count=1 ./tests/strictscope/...

      # The SDK is its own zero-dependency module, so the module-wide commands
      # above never see it. Untested here, it would only break in a consumer's
      # build — the one place we cannot fix it from.
      - name: Client SDK (vet, race)
        working-directory: sdk
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - name: Vulnerability scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck $(go list ./... | grep -v '/node_modules/')

  dialects:
    name: Databases (postgres, mysql, sqlserver)
    needs: ui
    runs-on: ubuntu-latest

    # Every dialect-specific test in this repository skips when its DSN is
    # unset, and none of the three DSNs was ever set anywhere. So the tests that
    # exist to catch "this query behaves differently on MySQL" — and the schema
    # tests that exist to catch "this column type does not exist on that engine"
    # — have never run outside a developer's own machine, which is how SQL
    # Server came to declare `uuid` columns it has no word for.
    #
    # The three databases are service containers. That is only possible on a
    # Linux runner with a Docker daemon — on the self-hosted Mac this job used
    # to run on they were ordinary steps driven by Apple's `container` CLI,
    # with SQL Server forced to amd64 under Rosetta because it ships no arm64
    # build. Here the runner is amd64 Linux, so SQL Server runs natively and
    # the orchestration is the runner's job rather than this file's.
    #
    # Health checks replace the wait loop the previous version carried: the job
    # does not start until every database answers, so a test can no longer fail
    # because it opened a connection a second too early.

    env:
      METIS_TEST_POSTGRES_DSN: "host=127.0.0.1 port=5432 user=postgres password=gobpm dbname=gobpm sslmode=disable"
      METIS_TEST_MYSQL_DSN: "root:gobpm@tcp(127.0.0.1:3306)/gobpm?charset=utf8mb4&parseTime=True&loc=Local"
      METIS_TEST_SQLSERVER_DSN: "sqlserver://sa:Gobpm_Str0ngPass1@127.0.0.1:1433?database=master&encrypt=disable"
      MSSQL_SA_PASSWORD: "Gobpm_Str0ngPass1"

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: gobpm
          POSTGRES_DB: gobpm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gobpm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24

      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: gobpm
          MYSQL_DATABASE: gobpm
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pgobpm --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 36

      # SQL Server takes the longest to accept connections and is the reason
      # the retry budget here is generous. The password is repeated as a
      # literal because a health-cmd is passed to Docker, not to the shell that
      # knows this job's env.
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Gobpm_Str0ngPass1"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Gobpm_Str0ngPass1 -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download UI dist
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

      # A skip here means a DSN did not reach the tests, which is the failure
      # this job exists to prevent — so the count is asserted rather than eyeballed.
      #
      # -count=1 for the same reason. Go's test cache is content-addressed over
      # the code, and models nothing about which database answered: on a runner
      # whose GOCACHE survives between runs, an unchanged tree returns
      # "ok ... (cached)" without opening a connection. That is not a hypothesis
      # — it is what this job did on the run that added it, going green in 34s
      # having started three databases and talked to none of them. Worse, a
      # cached run prints no test lines at all, so the skip assertion below
      # passes by having nothing to read. Both checks are asserted here because
      # both failures look exactly like success.
      - name: Run the dialect suites
        run: |
          set -o pipefail
          go test -count=1 -v ./tests/postgres/... ./tests/mysqldb/... ./tests/mssql/... \
            ./tests/tenant/... ./tests/migrations/... ./tests/replicas/... ./tests/outage/... \
            2>&1 | tee /tmp/dialects.log
          if grep -q -- "--- SKIP" /tmp/dialects.log; then
            echo "::error::A dialect test skipped, which means its DSN did not reach it:"
            grep -- "--- SKIP" /tmp/dialects.log
            exit 1
          fi
          if grep -q -- "(cached)" /tmp/dialects.log; then
            echo "::error::A dialect suite was served from the test cache, so no database was contacted:"
            grep -- "(cached)" /tmp/dialects.log
            exit 1
          fi

  golangci-lint:
    name: golangci-lint
    needs: ui
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the linter can diff against the merge base itself
          # rather than asking the API for the pull request patch.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download UI dist
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

      # Blocks every NEW violation while the pre-existing backlog (see the
      # .golangci.yml adoption note) is burned down by area. Do not weaken this
      # to "get green" — narrow the backlog instead.
      #
      # The diff comes from git rather than the action's only-new-issues, which
      # asks the API for the pull request patch and gives up past 300 files:
      # a branch this size got no linting at all, silently. --new-from-merge-base
      # is the same comparison done locally, with no such limit.
      #
      # Installed from source at a pinned version rather than through the action.
      # A released binary is built with whatever Go its release used and refuses
      # to run when that is older than the Go this module targets; building it
      # here uses the Go above. The version is pinned so a linter upgrade is a
      # deliberate commit rather than something that lands overnight, and the
      # module path carries the /v2 that matches this repository's config schema.
      - name: Install golangci-lint
        # v2.13.1, not v2.12.2. The older pin bundles honnef.co/go/tools 0.7.0,
        # whose IR builder panics on Go 1.27's own standard library —
        # `buildir: package "poll" ... unexpected expr: *ast.KeyValueExpr` —
        # and takes the whole run down with exit 3. v2.13.1 carries
        # staticcheck 0.8.0, which understands it.
        #
        # It is a Linux-only failure and a cold-cache-only one: internal/poll
        # has per-platform sources, and analysis facts for the standard library
        # are cached, so a warm macOS run reports a clean 0 issues while CI
        # panics on the same commit. That is why the Go 1.27 upgrade looked
        # green locally.
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1

      - name: golangci-lint
        run: golangci-lint run --new-from-merge-base=origin/${{ github.base_ref || 'main' }}

  proto-generated:
    name: Generated code matches protos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Installed from source at a pinned version rather than through
      # bufbuild/buf-action, for the same two reasons golangci-lint is:
      #
      #  - The action installs whatever buf is current, so a buf release could
      #    change this job's verdict with no commit here.
      #  - It is fetched from the Go module proxy instead of codeload, which
      #    returned 429 for every action download in this job across two
      #    consecutive runs. The job never reached `buf generate`; it failed
      #    downloading the tool that runs it.
      #
      # The plugins in buf.gen.yaml are already pinned, so the generated output
      # is determined by those rather than by the CLI — this pins the last
      # floating piece.
      - name: Setup buf
        run: go install github.com/bufbuild/buf/cmd/buf@v1.70.0

      # The .proto files are the contract for the Connect API the UI speaks.
      # They had silently diverged from the checked-in generated code: the
      # protos modelled relationships as nested messages while the generated Go
      # still had flat *_id strings, so anyone running `buf generate` — a normal
      # thing to do — broke the build, and no client generated from these protos
      # by a third party would have matched the server.
      #
      # Regenerating in CI and failing on any diff makes the protos the source
      # of truth in fact and not just in intent.
      - name: Regenerate
        run: buf generate

      - name: Fail if the tree changed
        run: |
          if ! git diff --quiet -- api/proto ui/src/gen; then
            echo "::error::Generated code is out of date. Run 'buf generate' and commit the result."
            git --no-pager diff --stat -- api/proto ui/src/gen
            exit 1
          fi
          echo "Generated code matches the protos."

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The gitleaks binary, not gitleaks-action.
      #
      # The action works out which commits to scan by calling
      # GET /repos/{owner}/{repo}/pulls/{n}/commits, and that call returned 403
      # "Resource not accessible by integration" even with pull-requests:read
      # granted and visible in the job's token — a failure the job reports in a
      # way that reads exactly like a secret was found. Twice now the fix has
      # been to grant a permission that was already there.
      #
      # Scanning the working tree needs no API call, no token and no license
      # check, and it is strictly more thorough: the action looks at one pull
      # request's commits, this looks at every file in the repository. The
      # version is pinned so a scanner release cannot turn a green branch red
      # without a commit here.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Installed from source at a pinned version rather than pulled as a
      # container image. This began as a workaround — the self-hosted runner
      # had no Docker daemon — and is kept now that one is available, because
      # the module proxy is already this file's install channel for
      # golangci-lint and buf, and setup-go puts GOPATH/bin on PATH the same
      # way it does for those two. One channel, one pin, one thing to bump.
      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Gitleaks scan
        run: gitleaks dir . --redact --no-banner --exit-code 1

      # A malformed workflow is the worst failure to diagnose here, because it
      # produces nothing to diagnose: GitHub refuses to start the run, so there
      # are no jobs, no steps and no logs — only a red mark. It happened on the
      # commit that added the step above, from a duplicated `working-directory`.
      #
      # A YAML parser will not catch that. Python's yaml.safe_load accepts a
      # duplicate key and silently keeps the last one, which is why the change
      # was validated and pushed anyway. actionlint knows the schema.
      - name: Lint the workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml

  image:
    name: Image (build and boot)
    runs-on: ubuntu-latest

    # The README calls the image the supported artifact, and until this job
    # existed nothing built it. A Dockerfile that no longer compiled — a renamed
    # entrypoint, a UI stage that stopped producing ui/dist — would have been
    # found by whoever deployed it, which is the wrong person to find it.
    #
    # Building is not enough on its own. The image is distroless: no shell, no
    # package manager. The usual mistakes — a dynamically linked binary against
    # a libc that is not there, a missing CA bundle, an entrypoint path that no
    # longer exists — all produce an image that builds perfectly and then exits
    # immediately. So it is started too, against a real PostgreSQL rather than
    # SQLite: the runtime stage sets no WORKDIR and is meant to be run with a
    # read-only root, so there is nowhere for a SQLite file to go. That is the
    # deployment shape docker-compose.yml describes, and it is the one worth
    # proving.

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: metis
          POSTGRES_PASSWORD: metis
          POSTGRES_DB: metis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `git describe` stamps the version into the binary, and a shallow
          # clone has no tags to describe against.
          fetch-depth: 0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        run: |
          docker build \
            --build-arg VERSION="$(git describe --tags --always --dirty)" \
            -t metis:ci .

      # The release publishes arm64 too, and until this existed that path was
      # only exercised by tagging — which is how the first release broke, on a
      # workflow that had never run. Built, not booted: an arm64 binary cannot
      # be executed on an amd64 runner without emulation, and proving it
      # compiles and assembles is what is actually at risk here.
      - name: Build the arm64 image the release will publish
        run: |
          docker buildx build --platform linux/arm64 \
            --build-arg VERSION="$(git describe --tags --always --dirty)" \
            -o type=cacheonly .

      - name: Boot it and ask what it is
        run: |
          set -euo pipefail
          # --network host so the container reaches the service container's
          # published port, and so :8080 lands where curl is looking.
          # Read-only root and the non-root user are how the image is meant to
          # be run, so they are how it is tested; /tmp is the only concession.
          docker run -d --name metis-ci \
            --network host \
            --read-only \
            --tmpfs /tmp \
            -e ENCRYPTION_KEY="$(openssl rand -hex 24)" \
            -e JWT_SECRET="$(openssl rand -base64 48)" \
            -e DATABASE_URL="host=127.0.0.1 user=metis password=metis dbname=metis port=5432 sslmode=disable" \
            metis:ci

          # /readyz rather than /healthz: it checks the database, so it proves
          # the image migrated and connected rather than merely started a
          # listener. Polled rather than slept on — a fixed wait is either
          # flaky or slow, and this way a failure prints the container's log.
          for i in $(seq 1 60); do
            if curl -fsS localhost:8080/readyz >/dev/null 2>&1; then
              echo "ready after ${i}s"
              curl -fsS localhost:8080/healthz; echo
              exit 0
            fi
            if ! docker ps -q --filter name=metis-ci --filter status=running | grep -q .; then
              echo "::error::The container exited instead of serving. Its log:"
              docker logs metis-ci
              exit 1
            fi
            sleep 1
          done

          echo "::error::/readyz never answered within 60s. The container log:"
          docker logs metis-ci
          exit 1

      - name: Stop it
        if: always()
        run: docker rm -f metis-ci || true

      # The manifest is a deployment people apply, so a typo in it is an
      # outage on their cluster rather than a red build here. Validated
      # against the real Kubernetes schemas, in the job that already proves
      # the image the manifest refers to.
      - name: Validate the Kubernetes manifest
        run: go run github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0 -strict -summary deploy/kubernetes/metis.yaml

      # A rules file with a bad expression is worse than no rules file: it
      # loads, it looks like coverage, and the alert never fires. promtool
      # parses the PromQL rather than just the YAML.
      - name: Validate the alerting rules
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import yaml
          spec = yaml.safe_load(open("deploy/kubernetes/alerts.yaml"))
          yaml.safe_dump({"groups": spec["spec"]["groups"]}, open("/tmp/rules.yaml", "w"))
          PY
          # The release binary rather than `go install`: the prometheus module
          # carries replace directives, so installing promtool from source
          # fails outright.
          PROM_VERSION=3.14.0
          curl -sSfL "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C /tmp "prometheus-${PROM_VERSION}.linux-amd64/promtool"
          /tmp/promtool check rules /tmp/rules.yaml

          # Parsing is not firing. A rule can be valid PromQL and still match
          # nothing — a label that does not exist, a ratio over an empty
          # denominator, a threshold on the wrong side — and stay silent
          # forever. These unit tests assert each alert fires on the shape of
          # data that should trigger it, and stays quiet on the shape that
          # should not.
          /tmp/promtool test rules deploy/kubernetes/alerts_test.yaml

# Dependency updates, proposed rather than discovered.
#
# CI already scans: govulncheck for Go and trivy against the built image (the
# web app's dependencies are gsoultan/metis-server's, with its own dependabot). Those tell you a dependency is a problem *now*, which
# is the wrong time to find out — usually during an incident, on a version that
# is several majors behind whatever fixes it. This opens the pull request before
# then.
#
# Weekly, not daily: a queue of update pull requests nobody reads is the same as
# no updates, and the verification gate has to run on every one of them.

version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Grouped so the gate runs once for a set rather than five times for five
      # patch bumps. Kept separate from majors, which need reading.
      go-minor-and-patch:
        update-types: [minor, patch]

    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"

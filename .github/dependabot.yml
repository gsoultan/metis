# Dependency updates, proposed rather than discovered.
#
# CI already scans: govulncheck for Go, `bun audit` for the UI, and trivy
# against the built image. Those tell you a dependency is a problem *now*, which
# is the wrong time to find out — usually during an incident, on a version that
# is several majors behind whatever fixes it. This opens the pull request before
# then.
#
# Weekly, not daily: a queue of update pull requests nobody reads is the same as
# no updates, and the verification gate has to run on every one of them.

version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Grouped so the gate runs once for a set rather than five times for five
      # patch bumps. Kept separate from majors, which need reading.
      go-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # grpc, held on the 1.83 line until 1.85 is a stable release.
      #
      # GO-2026-6443 is a remote panic in the HTTP/2 server: a request with a
      # missing authority or Host header crashes the listener, before any
      # authentication. It is reachable here — govulncheck traces it from
      # app.runServers through grpc.Server.Serve to http2Server.HandleStreams.
      #
      # The fix was backported to v1.83.2, which is what this module pins. It
      # is NOT in v1.84.0: that release shipped from a branch without it, so
      # the advisory's affected ranges read
      #
      #   fixed 1.83.2 · introduced 1.84.0-dev · fixed 1.85.0-dev.0.2026...
      #
      # which makes "upgrade grpc" a downgrade in security posture. Dependabot
      # optimises for newest and cannot know that; CI caught it (#65) and the
      # bump was declined.
      #
      # Lift this once a stable 1.85.x exists. The only fixed version above the
      # 1.83 line today is a pre-release pseudo-version, and this engine holds
      # durable business commitments — it does not run on a dev build of its
      # transport.
      - dependency-name: google.golang.org/grpc
        versions: [">=1.84.0"]

    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      ui-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned deliberately, and both would break if bumped alone:
      #
      #   typescript          — 7.x, the native compiler the build uses
      #   typescript-for-eslint — an aliased 6.x, because typescript-eslint
      #                           cannot load a 7.x compiler yet
      #
      # See ui/TYPESCRIPT.md. An automated bump of either is a broken lint or a
      # broken build, so they move together, by hand.
      - dependency-name: typescript
      - dependency-name: typescript-for-eslint
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"

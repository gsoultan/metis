# What the secret scanner is allowed to ignore, and why.
#
# Every entry here is a decision that something which looks like a credential is
# not one. That decision is only safe if it is narrow, so each rule names the
# file and the exact text rather than switching a detector off or excusing a
# directory. A blanket exclusion is how the one real secret in a test fixture
# directory goes unnoticed.
#
# Each entry says condition = "AND". gitleaks matches an allowlist when any one
# of its criteria matches unless told otherwise, so an entry naming a file and a
# string excused the whole file: a real secret added to the README would have
# passed the scan.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = """
  A sample password in the README, in the output of --reset-password.

  The command generates a password and prints it; the documentation shows what
  that looks like. Removing the sample would make the example less useful than
  the risk it carries, which is none — this string was never a password for
  anything.
  """
  paths = ['''^README\.md$''']
  condition = "AND"
  regexTarget = "match"
  regexes = ['''M6vY8yCdp879cTsmmWxp''']

  [[rules.allowlists]]
  description = """
  The encryption key in the config decryption test.

  It is a literal in the test that proves a connection string round-trips
  through encryption, and it says what it is in the value itself. A real key
  would defeat the test, which needs to control both ends.
  """
  paths = ['''^tests/config/config_test\.go$''']
  condition = "AND"
  regexTarget = "match"
  regexes = ['''my-encryption-key-16ch''']

  [[rules.allowlists]]
  description = """
  The SA password for the SQL Server container the dialect job starts.

  It exists so that the container and the DSN the tests connect with agree on
  a string, and the container is created and destroyed inside a single CI job
  — there is nothing it protects that outlives that job. SQL Server refuses to
  start without one, and it must be a literal in the workflow because the DSN
  next to it is also a literal; a repository secret would hide one half of a
  pair that has to match, and make a failure to match unreadable.
  """
  paths = ['''^\.github/workflows/security_reliability_ci\.yml$''']
  condition = "AND"
  regexTarget = "match"
  regexes = ['''GobpmTest2026x''']

  [[rules.allowlists]]
  description = """
  The keys in the key-rotation tests.

  The tests prove that data sealed under one key reads back under the next, so
  they must control every key involved, and each key says what it is in its
  value. None was ever a key for anything.
  """
  paths = ['''^internal/app/reseal_test\.go$''', '''^tests/crypto/keyring_test\.go$''']
  condition = "AND"
  regexTarget = "match"
  regexes = ['''the-key-that-leaked-9f2c7a41e0b3d865''', '''the-key-that-replaces-it-4be81d07c2f9a653''']

  [[rules.allowlists]]
  description = """
  The webhook row the legacy-window migration test writes the way the release
  before v2 did.

  Its secret column holds the literal 'a-secret' and its signature header
  'X-Signature-256', side by side in one INSERT, which the generic rule reads as
  a key assigned a value. It is a row in a scratch test database; neither value
  was ever a secret for anything.
  """
  paths = ['''^tests/migrations/webhook_legacy_window_test\.go$''']
  condition = "AND"
  regexTarget = "match"
  regexes = ['''a-secret', 'X-Signature-256''']
